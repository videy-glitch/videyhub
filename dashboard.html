<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VideyHub Dashboard</title>

<link rel="stylesheet" href="dashboard.css">
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            VIDEYHUB
        </div>

        <button class="new-btn" id="newLinkBtn">
            + LINK BARU
        </button>

    </div>

    <div class="stats">

        <div class="stat-card">

            <h3 id="totalLinks">0</h3>

            <p>Total Link</p>

        </div>

        <div class="stat-card">

            <h3 id="totalViews">0</h3>

            <p>Total Views</p>

        </div>

    </div>

    <div id="linkContainer">

        <div class="empty">

            Belum ada link.

        </div>

    </div>

    <div class="bottom-menu">

        <button id="settingBtn">

            ⚙ Pengaturan

        </button>

        <button id="logoutBtn">

            🚪 Logout

        </button>

    </div>

</div>


<!-- Modal -->

<div class="modal" id="modal">

    <div class="modal-box">

        <h2>Link Baru</h2>

        <input
        id="videoUrl"
        type="text"
        placeholder="Masukkan URL Video">

        <input
        id="yesRedirect"
        type="text"
        placeholder="Redirect tombol YA">

        <input
        id="noRedirect"
        type="text"
        placeholder="Redirect tombol TIDAK">

        <label>

            <input
            id="showBanner"
            type="checkbox"
            checked>

            Banner Atas

        </label>

        <br><br>

        <label>

            <input
            id="showTelegram"
            type="checkbox"
            checked>

            Join Telegram

        </label>

        <br><br>

        <button id="saveBtn">

            SIMPAN LINK

        </button>

    </div>

</div>

<script src="dashboard.js"></script>

</body>
</html>
