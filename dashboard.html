<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VideyHub Dashboard</title>

<link rel="stylesheet" href="dashboard.css">

</head>
<body>

<div class="sidebar">

    <h2>VIDEYHUB</h2>

    <button id="newLinkBtn">
        + Link Baru
    </button>

    <button id="settingBtn">
        ⚙ Pengaturan
    </button>

    <button id="logoutBtn">
        🚪 Logout
    </button>

</div>

<div class="content">

    <h1>Dashboard</h1>

    <div id="linkContainer">

        <div class="empty">

            Belum ada link.

        </div>

    </div>

</div>

<!-- MODAL -->

<div class="modal" id="modal">

    <div class="modal-box">

        <h2>Link Baru</h2>

        <input
            id="videoUrl"
            type="text"
            placeholder="URL Video">

        <input
            id="yesRedirect"
            type="text"
            placeholder="Redirect tombol YA">

        <input
            id="noRedirect"
            type="text"
            placeholder="Redirect tombol TIDAK">

        <label>

            <input
                id="showBanner"
                type="checkbox"
                checked>

            Banner Atas

        </label>

        <br><br>

        <label>

            <input
                id="showTelegram"
                type="checkbox"
                checked>

            Join Telegram

        </label>

        <br><br>

        <button id="saveBtn">

            SIMPAN

        </button>

    </div>

</div>

<script src="dashboard.js"></script>

</body>
</html>
