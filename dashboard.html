<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideyHub Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h2>VIDEYHUB</h2>

    <a href="#">🏠 Dashboard</a>
    <a href="#">🎬 Link Video</a>
    <a href="#">⚙️ Pengaturan</a>
    <a href="#">📊 Statistik</a>
    <a href="#">🚪 Logout</a>
</div>

<div class="content">

    <h1>Dashboard</h1>

    <button class="add-btn" id="openModal">
        + Link Baru
    </button>

    <h2>Daftar Link</h2>

    <div id="linkList">
        <p>Belum ada link.</p>
    </div>

</div>

<!-- MODAL -->

<div class="modal" id="videoModal">

    <div class="modal-box">

        <h2>Tambah Link Baru</h2>

        <input id="videoUrl" type="text" placeholder="URL Video">

        <input id="redirectUrl" type="text" placeholder="Redirect Link">

        <label>
            <input id="ageVerify" type="checkbox" checked>
            Verifikasi Umur
        </label>

        <br><br>

        <label>
            <input id="telegram" type="checkbox" checked>
            Join Telegram
        </label>

        <br><br>

        <button id="saveLink">
            Simpan
        </button>

    </div>

</div>

<script src="dashboard.js"></script>

</body>
</html>
